# Render fixture: one camera with main and sub ONVIF profiles and one camera
# with no profiles. The first emits two different go2rtc sources; the second
# emits one path under both keys (ADR 0037).
schema_version: 3

identity:
  hostname: bittern-profiles
  timezone: UTC

network:
  lan0:
    mode: dhcp
    subnet: 192.168.80.0/24
    gateway: 192.168.80.1
  cam0:
    mode: static
    address: 10.110.0.1/24
    dhcp:
      pool_start: 10.110.0.50
      pool_end: 10.110.0.199
      reservation_start: 10.110.0.10
      reservation_end: 10.110.0.49
      gateway: 10.110.0.1
      ntp_server: 10.110.0.1

cameras:
  - id: driveway
    name: Driveway
    address: 10.110.0.20
    rtsp_port: 554
    rtsp_path: /stream1
    credentials_ref: cameras.driveway
    profiles:
      main:
        profile_token: Profile_1
        rtsp_path: /Streaming/Channels/101?transport=tcp
        snapshot_path: /onvif-http/snapshot?Profile_1
        width: 1920
        height: 1080
        codec: h264
      sub:
        profile_token: Profile_2
        rtsp_path: /Streaming/Channels/102
        width: 640
        height: 360
        codec: h264
  - id: side_gate
    name: Side gate
    address: 10.110.0.21
    rtsp_port: 554
    rtsp_path: /stream1
    credentials_ref: cameras.side_gate

storage:
  recording:
    drives: []
    retention_days: 14
    free_space_reserve_gb: 50

updates:
  channel: stable

privacy:
  tailscale:
    enabled: false
    camera_subnet_route: false
