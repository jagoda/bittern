# Time client on lan0 and NTP server for cameras on cam0 (ADR 0035).
#
# The system clock and the hardware clock are UTC. This file never sets a
# local time anywhere: the zone is a display and camera-time concern.
driftfile /var/lib/chrony/chrony.drift
# Step a correction larger than one second, but only within the first three
# clock updates after start. Later corrections slew at maxslewrate so a
# running system is not jumped. The window counts updates, not wall time.
makestep 1.0 3
# Copy the UTC system clock to the hardware clock. The RTC is never local time.
rtcsync

# Acquire upstream time on the house network only. Upstream sources are OQ-20;
# the public pool is the provisional renderer default until a source set is
# decided, and every option is consumed on lan0.
bindacqdevice lan0
pool pool.ntp.org iburst

# With no reachable source chronyd does not correct the clock. The local
# reference keeps it serving the last known time to the camera network, at a
# stratum above any real server, so every camera still agrees with the
# recording timeline. The status reports the clock as unconfirmed (ADR 0035
# section 3).
local stratum 10

# Serve NTP to the camera network only. There is no server socket on lan0 or
# the tailnet, and no relay between the two segments.
# The server socket is bound to the camera address, and the camera subnet is
# the only allowed client set.
bindaddress 10.77.0.1
allow 10.77.0.0/24
