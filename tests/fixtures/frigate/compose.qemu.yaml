# Hand-written QEMU fixture, not the product bundle. The renderer will own this file later.
#
# This variant omits the GPU and USB devices because the QEMU guest has no passthrough devices.
# Everything else matches compose.yaml, including the pinned image and host networking.
name: bittern-frigate-fixture

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
    container_name: frigate
    network_mode: host
    restart: unless-stopped
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/config
      - ./state/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1073741824
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
