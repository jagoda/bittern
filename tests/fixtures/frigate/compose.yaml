# Hand-written fixture, not the product bundle. The renderer will own this file later.
#
# The image is pinned by tag plus the index digest from manifest.json. Host networking is required
# by ADR 0004, so there are no published ports. The host nftables policy is the boundary.
name: bittern-frigate-fixture

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
    container_name: frigate
    network_mode: host
    restart: unless-stopped
    shm_size: "1gb"
    devices:
      - /dev/dri:/dev/dri
      - /dev/bus/usb:/dev/bus/usb
    group_add:
      - "44"
      - "992"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/config
      - ./state/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1073741824
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
