# Hand-written Frigate fixture for one synthetic camera. Not generated by the renderer.
# The camera address is the QEMU camera guest on the isolated cam0 segment.
mqtt:
  enabled: false

tls:
  enabled: false

auth:
  enabled: true
  # Fixture-only: print a fresh admin password at each start so smoke.sh can log in.
  # The product will store, redact, and rotate the generated password instead.
  reset_admin_password: true

telemetry:
  version_check: false

networking:
  ipv6:
    enabled: false
  listen:
    internal: 127.0.0.1:5000
    # ADR 0016: the Frigate UI is a loopback-only support path, not a LAN surface.
    external: 127.0.0.1:8971

detectors:
  cpu:
    type: cpu

database:
  # ADR 0014: the Frigate media database belongs on the recording drive, not /config.
  path: /media/frigate/frigate.db

snapshots:
  enabled: true
  timestamp: false
  bounding_box: false
  quality: 80
  retain:
    default: 3

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 0
  alerts:
    retain:
      days: 3
  detections:
    retain:
      days: 3

objects:
  track:
    - person

cameras:
  cam0:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://10.77.0.20:8554/cam0
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
