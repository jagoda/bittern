# CI phase three, ADR 0033. A manual dispatch is the normal beta release
# trigger. It runs the release preflight, then calls the publish workflow with
# the tag and generation the preflight computed. The publish workflow runs the
# phase one checks, builds and signs in beta-draft, creates the tag at the
# checked commit only after the build and signature succeed, creates the draft,
# and publishes it after the beta environment approval.
#
# The dry_run input defaults to true. The default dispatch runs the preflight,
# calls publish.yml with dry_run true and create_tag false, runs the checks and
# the signing step, and creates no tag, draft, or release. It is the proof of
# the real call path before a publish dispatch.
#
# The optional confirm input is the tag printed by make release-preflight. A
# publish dispatch sets dry_run false and must also supply that tag in confirm.
# A mismatched confirmation fails the preflight, and an empty one skips the
# release job. A dry-run dispatch does not need it.
#
# The tag push path remains in publish.yml as the fallback. It is not started by
# this workflow, and a tag created here is never pushed through the tag path.
#
# Least privilege: the preflight reads contents, check runs, and the public
# environment policies. It declares no environment and receives no secret; the
# draft job's beta-draft gate is where the CI key is checked and used. Only the
# release job, which calls the tag, draft, and publish jobs, gets contents
# write. The CI test key stays in beta-draft and is never passed to the publish
# job. Every action is SHA-pinned.
name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Tag printed by make release-preflight; required to publish
        required: false
        type: string
        default: ""
      dry_run:
        description: Run the real call path and signing with no tag, draft, or release
        required: true
        type: boolean
        default: true

# One release at a time. Two runs must not compute the same generation, and a
# run waiting for the beta approval must not be cancelled.
concurrency:
  group: bittern-release-beta
  cancel-in-progress: false

# Read at the workflow level. The release job raises contents to write for the
# called tag, draft, and publish jobs; the called tag and checks jobs reduce
# themselves back to read.
permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    # No environment declaration: the preflight reads public metadata with the
    # workflow token and needs no environment secret. It therefore has no ref
    # gate of its own, and the check runs before any key-bearing job. It
    # inherits contents: read and actions: read from the workflow level.
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      generation: ${{ steps.preflight.outputs.generation }}
      commit: ${{ steps.preflight.outputs.commit }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from agent/go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # The script performs every check and writes the tag, generation, and
      # commit to GITHUB_OUTPUT. It creates no tag, draft, or release.
      - name: Run the release preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: make release-preflight

  release:
    name: build, tag, draft, publish
    needs: preflight
    # The default dry_run=true dispatch calls the reusable publish workflow so
    # the called path, its conditions, and the signing step run with no tag or
    # release. A publish dispatch must also confirm the tag the preflight
    # printed; the preflight already failed a mismatched confirmation.
    if: >-
      needs.preflight.result == 'success' &&
      (inputs.dry_run || inputs.confirm == needs.preflight.outputs.tag)
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
      generation: ${{ needs.preflight.outputs.generation }}
      commit: ${{ needs.preflight.outputs.commit }}
      create_tag: ${{ inputs.dry_run == false }}
      dry_run: ${{ inputs.dry_run }}
