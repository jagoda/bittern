# CI phase three, ADR 0033. A manual dispatch is the normal beta release
# trigger. It runs the release preflight, then calls the publish workflow with
# the tag and generation the preflight computed. The publish workflow runs the
# phase one checks, builds and signs in beta-draft, creates the tag at the
# checked commit only after the build and signature succeed, creates the draft,
# and publishes it after the beta environment approval.
#
# The optional confirm input is the tag printed by make release-preflight. An
# empty confirmation runs the preflight only and builds nothing, so the
# maintainer can see the plan in the run summary. A confirmation that does not
# match the computed tag fails the preflight before any build.
#
# The tag push path remains in publish.yml as the fallback. It is not started by
# this workflow, and a tag created here is never pushed through the tag path.
#
# Least privilege: the preflight reads contents, check runs, and the public
# environment policies. Only the release job, which calls the tag, draft, and
# publish jobs, gets contents write. The CI test key stays in beta-draft and is
# never passed to the publish job. Every action is SHA-pinned.
name: release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Tag printed by make release-preflight; empty runs the plan only
        required: false
        type: string
        default: ""

# One release at a time. Two runs must not compute the same generation, and a
# run waiting for the beta approval must not be cancelled.
concurrency:
  group: bittern-release-beta
  cancel-in-progress: false

# Read at the workflow level. The release job raises contents to write for the
# called tag, draft, and publish jobs; the called tag and checks jobs reduce
# themselves back to read.
permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    # beta-draft scopes the CI test key. The job only compares the secret to
    # the empty string to prove the name exists; the value is never printed or
    # passed to a command. The dispatch runs at main, so the environment must
    # admit main in addition to app-beta-*.
    environment:
      name: beta-draft
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      generation: ${{ steps.preflight.outputs.generation }}
      commit: ${{ steps.preflight.outputs.commit }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from agent/go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # The script performs every check and writes the tag, generation, and
      # commit to GITHUB_OUTPUT. It creates no tag, draft, or release.
      - name: Run the release preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          # Presence only. The expression compares the secret to the empty
          # string; the value is not placed in the environment or printed.
          BITTERN_PREFLIGHT_SECRET_PRESENT: ${{ secrets.BITTERN_CI_SIGNING_KEY != '' }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: make release-preflight

  release:
    name: build, tag, draft, publish
    needs: preflight
    # An empty confirmation is a plan-only dispatch. A non-empty confirmation
    # must equal the computed tag; the preflight already failed if it does not.
    if: needs.preflight.result == 'success' && inputs.confirm == needs.preflight.outputs.tag
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
      generation: ${{ needs.preflight.outputs.generation }}
      commit: ${{ needs.preflight.outputs.commit }}
      create_tag: true
      dry_run: false
