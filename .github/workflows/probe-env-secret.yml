# Temporary verification probe. It exists only to prove how the beta-draft
# environment gates BITTERN_CI_SIGNING_KEY, and it is removed in the same
# session. It reports presence, length, and the ref. It never prints, hashes,
# or stores the value and it writes nothing to the workspace.
name: probe-env-secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: report the beta-draft secret without revealing it
    runs-on: ubuntu-24.04
    environment:
      name: beta-draft
    steps:
      - name: Report presence, length, and ref
        env:
          BITTERN_CI_SIGNING_KEY: ${{ secrets.BITTERN_CI_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${BITTERN_CI_SIGNING_KEY:-}" ]; then
            secret_empty=yes
            secret_length=0
          else
            secret_empty=no
            secret_length=${#BITTERN_CI_SIGNING_KEY}
          fi
          printf 'event=%s\n' "$GITHUB_EVENT_NAME"
          printf 'ref=%s\n' "$GITHUB_REF"
          printf 'ref_name=%s\n' "$GITHUB_REF_NAME"
          printf 'secret_empty=%s\n' "$secret_empty"
          printf 'secret_length=%s\n' "$secret_length"
