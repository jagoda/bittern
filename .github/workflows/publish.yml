# CI phase two, per ADR 0031, ADR 0032, and ADR 0033. There are three paths:
#
# - A manual dispatch of release.yml (ADR 0033) runs the release preflight,
#   computes the next generation, and calls this workflow. The default
#   dry_run=true call runs the same checks, build, and signature and creates no
#   tag, draft, or release. The dry_run=false call creates the tag at the
#   checked commit and uploads exactly the five release assets to a draft. The
#   tag is created only after the build and signature succeed.
# - A push of an app-beta-* tag is the fallback path. The tag exists before the
#   run, so this workflow validates it, builds, signs, and creates the draft
#   against the existing tag. It does not compute the generation.
# - A workflow_dispatch of this workflow with dry_run=true is the standalone
#   dry run. It validates the supplied tag, builds and signs the same bytes,
#   verifies the signature, prints the five asset digests, and creates no tag,
#   draft, or release. A direct dispatch cannot publish because it never
#   supplies create_tag.
#
# The draft job runs in beta-draft, which scopes the CI test key to the ref and
# holds no required reviewer. The publish job runs in the protected beta
# environment, verifies the draft's asset names and recorded digests, and flips
# the existing draft to published after the maintainer approves. The tag push
# fallback runs the workflow file at the tagged commit, not the copy on main.
#
# No release private key is present. The CI test key is held by the draft job
# through the beta-draft environment, and its public half is
# packaging/trust/beta-ci.pub. The approval gate is the separate beta
# environment. beta-draft has no required reviewer because it publishes
# nothing. The release workflow's preflight job and its draft job both run at
# the dispatch ref, main, so both environments need the main branch policy in
# addition to the app-beta-* tag policy. QEMU and hardware tests stay outside
# CI.
name: publish

on:
  push:
    # The glob is deliberately broad. The first job applies the exact tag rule
    # with the Go parser before any check or release build can run.
    tags:
      - 'app-beta-*'
  # The dry run validates a tag before it exists, so it cannot be the tag push
  # trigger. A direct dispatch supplies only the tag and dry_run inputs; it
  # never supplies create_tag, so it can only run the dry run.
  workflow_dispatch:
    inputs:
      tag:
        description: Application bundle tag to validate
        required: true
        type: string
        default: app-beta-000001
      dry_run:
        description: Run every step except creating or publishing a release
        required: true
        type: boolean
        default: true
  # The release workflow calls this workflow with the tag, generation, and
  # commit the preflight computed. create_tag is true only on its publish path;
  # its dry-run call sets dry_run true and create_tag false. The tag push
  # fallback already has its tag, and a dry run never creates one.
  workflow_call:
    inputs:
      tag:
        description: Application bundle tag computed by the release preflight
        required: true
        type: string
      generation:
        description: Generation the preflight computed for the tag
        required: true
        type: string
      commit:
        description: Commit the preflight checked and the tag must point at
        required: true
        type: string
      create_tag:
        description: Create the tag after the build and signature succeed
        required: false
        type: boolean
        default: false
      dry_run:
        description: Run every step except creating a tag or a release
        required: false
        type: boolean
        default: false
    # A reusable workflow does not receive the caller's secrets implicitly.
    # The caller passes this name so the draft job's beta-draft environment can
    # resolve it. The publish job does not use this environment and never reads
    # the key.
    secrets:
      BITTERN_CI_SIGNING_KEY:
        description: Base64-encoded CI test signing seed from beta-draft
        required: true

# One run per tag, and never cancel a run that may be waiting for approval.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege. The phase one checks are read-only. Only the two release
# jobs get contents: write. The draft job uses beta-draft for key scope and the
# publish job uses beta for the approval gate.
permissions:
  contents: read

jobs:
  tag:
    name: validate tag
    runs-on: ubuntu-24.04
    outputs:
      generation: ${{ steps.parse.outputs.generation }}
      tag: ${{ steps.select.outputs.tag }}
      commit: ${{ steps.select.outputs.commit }}
      dry_run: ${{ steps.select.outputs.dry_run }}
      create_tag: ${{ steps.select.outputs.create_tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from agent/go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # A push has no tag input, so its tag is the literal tag ref that started
      # the run and is never taken from an input. Every other run is input
      # driven: a direct dispatch or the release workflow calling this one. The
      # event name is not used because a reusable workflow sees the caller's
      # event, so workflow_call is indistinguishable from the direct dispatch
      # that started the caller. The selected action is explicit: dry_run=true
      # creates nothing, dry_run=false with create_tag=true is the publish
      # path, and a tag input with dry_run=false but create_tag=false is
      # refused.
      - name: Select the tag, commit, and release action
        id: select
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_CREATE_TAG: ${{ inputs.create_tag }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$INPUT_TAG" ]; then
            case "$REF" in
              refs/tags/app-beta-*) ;;
              *)
                printf 'a publish run without a tag input requires a refs/tags/app-beta-* ref, not %s\n' "$REF" >&2
                exit 1
                ;;
            esac
            tag="$REF_NAME"
            commit="$WORKFLOW_SHA"
            dry_run=false
            create_tag=false
          else
            case "$REF" in
              refs/heads/*) ;;
              *)
                printf 'a publish run with a tag input requires a branch ref, not %s\n' "$REF" >&2
                exit 1
                ;;
            esac
            tag="$INPUT_TAG"
            case "$INPUT_DRY_RUN" in
              true) dry_run=true ;;
              false) dry_run=false ;;
              *)
                printf 'the dry_run input is %s, not true or false\n' "$INPUT_DRY_RUN" >&2
                exit 1
                ;;
            esac
            case "$INPUT_CREATE_TAG" in
              ''|false) create_tag=false ;;
              true) create_tag=true ;;
              *)
                printf 'the create_tag input is %s, not true or false\n' "$INPUT_CREATE_TAG" >&2
                exit 1
                ;;
            esac
            if [ "$dry_run" = "true" ] && [ "$create_tag" = "true" ]; then
              printf 'a dry run cannot create a tag\n' >&2
              exit 1
            fi
            if [ "$dry_run" = "false" ] && [ "$create_tag" != "true" ]; then
              printf 'a run with a tag input publishes only when create_tag is true; a direct dispatch is the dry-run path\n' >&2
              exit 1
            fi
            if [ -n "$INPUT_COMMIT" ] && [ "$INPUT_COMMIT" != "$WORKFLOW_SHA" ]; then
              printf 'the input commit %s does not equal the workflow commit %s\n' \
                "$INPUT_COMMIT" "$WORKFLOW_SHA" >&2
              exit 1
            fi
            commit="${INPUT_COMMIT:-$WORKFLOW_SHA}"
          fi
          case "$tag" in
            app-beta-*) ;;
            *)
              printf 'the tag %s is outside the app-beta-* namespace\n' "$tag" >&2
              exit 1
              ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'dry_run=%s\n' "$dry_run" >> "$GITHUB_OUTPUT"
          printf 'create_tag=%s\n' "$create_tag" >> "$GITHUB_OUTPUT"
          printf 'selected tag: %s\n' "$tag"
          printf 'selected commit: %s\n' "$commit"
          printf 'dry run: %s\n' "$dry_run"
          printf 'create tag: %s\n' "$create_tag"

      # The first command that can fail is the repository's own tag parser. It
      # rejects uppercase hex, five or seven characters, an empty suffix, a
      # non-hex character, and generation zero. No release asset is built before
      # this passes. A supplied generation is the preflight value, and it must
      # equal what the parser reads from the tag.
      - name: Parse the tag with the repository rule
        id: parse
        env:
          TAG: ${{ steps.select.outputs.tag }}
          INPUT_GENERATION: ${{ inputs.generation }}
        run: |
          set -eu
          make bittern-release
          parsed_generation="$(agent/bin/bittern-release tag "$TAG")"
          if [ -n "$INPUT_GENERATION" ] && [ "$parsed_generation" != "$INPUT_GENERATION" ]; then
            printf 'the Go parser read generation %s, the preflight computed %s\n' \
              "$parsed_generation" "$INPUT_GENERATION" >&2
            exit 1
          fi
          generation="${INPUT_GENERATION:-$parsed_generation}"
          printf 'generation=%s\n' "$generation" >> "$GITHUB_OUTPUT"

  checks:
    name: checks and unsigned test build
    needs: tag
    # The reusable phase one workflow is the single definition of green. It
    # runs make check and builds the unsigned payload, manifest, kit, and
    # checksums in the same run, so there is no second copy of the check logic.
    uses: ./.github/workflows/check.yml
    with:
      generation: ${{ needs.tag.outputs.generation }}

  draft:
    name: sign and stage draft
    needs: [tag, checks]
    runs-on: ubuntu-24.04
    # beta-draft holds the CI test key and has no required reviewer, so the
    # draft exists before the beta approval. The approval gate is beta on the
    # publish job. The dispatch release and the dry run both run at main, so
    # beta-draft must admit main in addition to app-beta-*; the tag push path
    # uses the tag policy. The preflight verifies both refs before any build.
    environment:
      name: beta-draft
    permissions:
      contents: write
    outputs:
      digests: ${{ steps.record.outputs.digests }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go from agent/go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Download the unsigned build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bittern-beta-unsigned-test-build
          path: build/assets

      - name: Build the release tool
        run: make bittern-release

      # The generation is the anti-rollback counter from ADR 0031. It must equal
      # both the tag suffix and the manifest field, or the release is wrong and
      # must not be signed. The source commit check ties the manifest to the
      # commit the tag points at.
      - name: Check the asset set, generation, and source commit
        id: manifest
        env:
          TAG_GENERATION: ${{ needs.tag.outputs.generation }}
          RELEASE_COMMIT: ${{ needs.tag.outputs.commit }}
        run: |
          set -eu
          for asset in manifest.json bittern-app.tar.gz bittern-beta-kit.tar.gz SHA256SUMS; do
            test -f "build/assets/$asset" || {
              printf 'the unsigned build is missing %s\n' "$asset" >&2
              exit 1
            }
          done
          manifest_generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["generation"])' build/assets/manifest.json)"
          if [ "$manifest_generation" != "$TAG_GENERATION" ]; then
            printf 'the manifest generation %s does not equal the tag generation %s\n' \
              "$manifest_generation" "$TAG_GENERATION" >&2
            exit 1
          fi
          manifest_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_commit"])' build/assets/manifest.json)"
          if [ "$manifest_commit" != "$RELEASE_COMMIT" ]; then
            printf 'the manifest source_commit %s does not equal the release commit %s\n' \
              "$manifest_commit" "$RELEASE_COMMIT" >&2
            exit 1
          fi
          payload_sha256="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["payload"]["sha256"])' build/assets/manifest.json)"
          printf '%s  bittern-app.tar.gz\n' "$payload_sha256" | (cd build/assets && sha256sum -c -)
          (cd build/assets && sha256sum -c SHA256SUMS)
          printf 'generation=%s\n' "$manifest_generation" >> "$GITHUB_OUTPUT"

      # The secret is base64-encoded raw seed bytes. It is decoded into the
      # runner's temporary directory with mode 0600, used once, and removed by
      # the trap. The secret is stored in beta-draft, not at repository scope
      # and not in the approving beta environment. The always() step below
      # covers a job-level failure as well.
      - name: Sign the manifest with the CI test key
        env:
          BITTERN_CI_SIGNING_KEY: ${{ secrets.BITTERN_CI_SIGNING_KEY }}
        run: |
          set -eu
          key_path="$RUNNER_TEMP/bittern-ci-signing-key"
          cleanup() { rm -f "$key_path"; }
          trap cleanup EXIT
          printf '%s' "$BITTERN_CI_SIGNING_KEY" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          key_size="$(wc -c < "$key_path" | tr -d ' ')"
          if [ "$key_size" -ne 32 ]; then
            printf 'the decoded CI key is %s bytes, not the 32-byte Ed25519 seed\n' "$key_size" >&2
            exit 1
          fi
          key_id="$(agent/bin/bittern-release key-id "$key_path" | sed -n 's/^key-id: key id //p')"
          manifest_key_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["signing"]["key_id"])' build/assets/manifest.json)"
          if [ "$key_id" != "$manifest_key_id" ]; then
            printf 'the CI key id %s does not equal the manifest signing key id %s\n' \
              "$key_id" "$manifest_key_id" >&2
            exit 1
          fi
          agent/bin/bittern-release sign build/assets/manifest.json --key "$key_path" --yes
          rm -f "$key_path"

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/bittern-ci-signing-key"

      - name: Verify the signature with the CI test anchor
        run: |
          set -eu
          key_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["signing"]["key_id"])' build/assets/manifest.json)"
          install -d -m 0755 "$RUNNER_TEMP/beta-trust"
          install -m 0644 packaging/trust/beta-ci.pub "$RUNNER_TEMP/beta-trust/$key_id.pub"
          agent/bin/bittern-release verify \
            build/assets/manifest.json \
            build/assets/manifest.json.sig \
            --trust-dir "$RUNNER_TEMP/beta-trust"

      # The dry run stops before anything leaves the runner. The signature has
      # been verified, and the five names below are the exact bytes the draft
      # job would upload. The output is also the run's step summary so the
      # maintainer can copy it into the run record.
      - name: Print the dry-run result
        if: needs.tag.outputs.dry_run == 'true'
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          manifest_field() {
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))[sys.argv[2]])' \
              build/assets/manifest.json "$1"
          }
          generation="$(manifest_field generation)"
          channel="$(manifest_field channel)"
          source_commit="$(manifest_field source_commit)"
          summary="$RUNNER_TEMP/dry-run-summary.md"
          {
            printf '### Publish dry run: %s\n\n' "$TAG"
            printf 'No tag, draft, release, or upload was created.\n\n'
            printf -- '- Manifest generation: %s\n' "$generation"
            printf -- '- Manifest channel: %s\n' "$channel"
            printf -- '- Manifest source commit: %s\n' "$source_commit"
            printf -- '- Generated at: %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '| Asset | SHA-256 |\n| --- | --- |\n'
            (cd build/assets && sha256sum \
              manifest.json \
              manifest.json.sig \
              bittern-app.tar.gz \
              bittern-beta-kit.tar.gz \
              SHA256SUMS) | awk '{printf "| `%s` | `%s` |\n", $2, $1}'
          } > "$summary"
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the release notes
        env:
          TAG_GENERATION: ${{ needs.tag.outputs.generation }}
          TAG: ${{ needs.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.tag.outputs.commit }}
        run: |
          set -eu
          {
            printf 'Bittern beta generation %s\n\n' "$TAG_GENERATION"
            printf -- '- Channel: beta\n'
            printf -- '- Generation: %s\n' "$TAG_GENERATION"
            printf -- '- Source commit: %s\n' "$RELEASE_COMMIT"
            printf -- '- Tag: %s\n\n' "$TAG"
            printf 'Assets:\n'
            printf -- '- manifest.json\n'
            printf -- '- manifest.json.sig\n'
            printf -- '- bittern-app.tar.gz\n'
            printf -- '- bittern-beta-kit.tar.gz\n'
            printf -- '- SHA256SUMS\n\n'
            printf 'The beta preparation kit is not an update payload. It is unsigned, must be verified with its published SHA-256 before running, and installs only the CI test anchor.\n\n'
            printf 'Verify the kit checksum after download:\n\n'
            printf '```sh\nsha256sum -c SHA256SUMS\n```\n'
          } > "$RUNNER_TEMP/release-notes.md"

      # The dispatch release creates the tag here, after the checks, the build,
      # the signature, and the signature verification have all succeeded. The
      # tag push fallback already has its tag, and the dry run never creates
      # one. The remote check is a race guard: a concurrent release that took
      # this generation fails before the draft is created.
      - name: Create the tag at the checked commit
        if: needs.tag.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.tag.outputs.commit }}
        run: |
          set -eu
          commit="$RELEASE_COMMIT"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            printf 'tag %s already exists; a release tag is never moved or reused\n' "$TAG" >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$commit" >/dev/null
          created="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [ "$created" != "$commit" ]; then
            printf 'the created tag %s points at %s, not %s\n' "$TAG" "$created" "$commit" >&2
            exit 1
          fi
          printf 'created tag %s at %s\n' "$TAG" "$commit"

      - name: Create the draft release with exactly five assets
        if: needs.tag.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            build/assets/manifest.json \
            build/assets/manifest.json.sig \
            build/assets/bittern-app.tar.gz \
            build/assets/bittern-beta-kit.tar.gz \
            build/assets/SHA256SUMS

      - name: Confirm the draft carries exactly the five assets
        if: needs.tag.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            manifest.json \
            manifest.json.sig \
            bittern-app.tar.gz \
            bittern-beta-kit.tar.gz \
            SHA256SUMS | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'the draft asset set is wrong\nexpected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      # The dry run created no tag and no release. Fail closed if either one is
      # already there, because the dry run validates a tag before it is pushed
      # and must never be confused with a published generation.
      - name: Confirm the dry run created no tag and no release
        if: needs.tag.outputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            printf 'a release named %s exists; a dry run validates a tag that does not exist yet\n' "$TAG" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            printf 'tag %s exists; a dry run validates a tag that does not exist yet\n' "$TAG" >&2
            exit 1
          fi
          printf 'confirmed: no tag and no release named %s\n' "$TAG"

      # The publish job has no build action. Record the uploaded asset digests
      # here so that job can prove the draft still carries exactly these bytes
      # before the visible flip. Base64 keeps the job output on one line.
      - name: Record the signed asset digests
        id: record
        run: |
          set -eu
          digests="$(cd build/assets && sha256sum \
            manifest.json \
            manifest.json.sig \
            bittern-app.tar.gz \
            bittern-beta-kit.tar.gz \
            SHA256SUMS | base64 -w0)"
          printf 'digests=%s\n' "$digests" >> "$GITHUB_OUTPUT"

  publish:
    name: publish the verified draft
    # A dry run never reaches the approval gate. The tag push fallback and the
    # dispatch release both do, because both set dry_run to false. The branch
    # policy on beta decides whether the dispatch ref, main, is admitted; the
    # explicit condition keeps the dry run from waiting on it.
    needs: [tag, draft]
    if: needs.tag.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    # The beta environment carries the required reviewer and the app-beta-*
    # tag and main branch policies. The draft already exists, so an unapproved
    # run leaves it in place and publishes nothing. This job takes no build
    # action and never receives the CI test key.
    environment:
      name: beta
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      # Verify the asset names and the recorded digests from the draft itself,
      # not from a rebuilt tree. The signature and manifest uploaded by the
      # draft job are the bytes that become visible.
      - name: Verify the draft asset set and recorded digests
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGESTS: ${{ needs.draft.outputs.digests }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -eu
          if [ -z "$EXPECTED_DIGESTS" ]; then
            printf 'the draft job recorded no asset digests\n' >&2
            exit 1
          fi
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            printf 'release %s is not a draft\n' "$TAG" >&2
            exit 1
          fi
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            manifest.json \
            manifest.json.sig \
            bittern-app.tar.gz \
            bittern-beta-kit.tar.gz \
            SHA256SUMS | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'the draft asset set is wrong\nexpected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          printf '%s' "$EXPECTED_DIGESTS" | base64 --decode > "$RUNNER_TEMP/expected.sha256"
          mkdir -p "$RUNNER_TEMP/draft-assets"
          gh release download "$TAG" --dir "$RUNNER_TEMP/draft-assets"
          count="$(find "$RUNNER_TEMP/draft-assets" -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 5 ]; then
            printf 'the draft download has %s files, not 5\n' "$count" >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP/draft-assets" && sha256sum -c "$RUNNER_TEMP/expected.sha256")

      # The asset set and every digest match the draft job's record. This is the
      # single visible flip from draft to published release.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
