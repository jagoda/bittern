# Bittern product policy for the release channel.
#
# The update channel is GitHub Releases in jagoda/bittern. The tag scheme,
# asset names, and draft publication rule are in ADR 0031. The device reads the
# newest published release in its channel namespace; there is no separate
# pointer file and no Bittern update-check endpoint.
#
# These are product defaults, not owner configuration. The channel itself is
# recorded in appliance.yaml.
schema_version: 1

release:
  # Release page root. Asset URLs are:
  #   <base_url>/download/<tag>/<asset>
  # The default repository is jagoda/bittern.
  base_url: https://github.com/jagoda/bittern/releases
  # Interval between update checks when checking is enabled. This does not
  # decide whether a device checks automatically; that policy remains OQ-12.
  check_interval: 24h
  # Beta test bundle compatibility. The platform provider reads
  # /usr/lib/bittern/platform.json and is provisional until the image ADR fixes
  # the metadata layout. No image writes the file yet, so a beta test bundle
  # claims one OS generation only: the Debian 13 amd64 base the kit and the
  # bench runs use. It must not claim a 0 to maximum range, which would silently
  # accept an unknown or untested platform. When the image writes generation 1
  # metadata and a later OS generation is tested, widen this range in a reviewed
  # change and re-date the evidence. See the phase two note for the reasoning.
  beta_bundle:
    os_generation_min: 1
    os_generation_max: 1
    schema_min: 1
    schema_max: 2
    updater_min: 1
