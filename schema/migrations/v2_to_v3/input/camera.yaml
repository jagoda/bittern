schema_version: 2
identity:
  hostname: bittern
  timezone: UTC
network:
  lan0:
    mode: dhcp
    subnet: 192.168.1.0/24
  cam0:
    mode: static
    address: 10.77.0.1/24
    dhcp:
      pool_start: 10.77.0.50
      pool_end: 10.77.0.199
      reservation_start: 10.77.0.10
      reservation_end: 10.77.0.49
      gateway: 10.77.0.1
      ntp_server: 10.77.0.1
cameras:
  - id: front_door
    name: Front door
    address: 10.77.0.20
    rtsp_port: 554
    rtsp_path: /stream1
storage:
  recording:
    mount_point: /var/lib/bittern/media
    retention_days: 14
    free_space_reserve_gb: 50
    drives: []
updates:
  channel: stable
privacy:
  tailscale:
    enabled: false
